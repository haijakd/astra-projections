<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact | Astra Projections</title>
<meta name="description" content="Contact Astra Projections about talent, gigs and collaborations.">
<link rel="icon" href="img/logo-triangle.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="contact">
<header class="site-header">
  <div class="inner">
    <nav>
      <a href="index.html">ASTRA PROJECTIONS</a>
      <a href="services.html">SERVICES</a>
      <a href="contact.html" aria-current="page">CONTACT</a>
    </nav>
    <div class="social">
      <a href="https://www.facebook.com/ASTRAprojections/" target="_blank" rel="noopener" aria-label="Facebook"><img src="img/icon-facebook.png" alt="Facebook"></a>
      <a href="https://www.linkedin.com/company/astra-projections-llc" target="_blank" rel="noopener" aria-label="LinkedIn"><img src="img/icon-linkedin.png" alt="LinkedIn"></a>
    </div>
  </div>
</header>

<main>
<section class="contact-hero">
  <div class="brand">
    <img class="tri" src="img/logo-triangle.png" alt="">
    <img class="word" src="img/logo-wordmark.png" alt="Astra Projections">
  </div>
  <h1>We're always looking for new talent, gigs and<br>collaborations to get involved with.<br>Tell us how you see Astra Projections working for you.</h1>
  <p class="sub">Send us a message using the form below!</p>
  <form class="quote center" data-kind="contact message">
    <input name="name" placeholder="Name *" required aria-label="Name">
    <input name="email" type="email" placeholder="Email *" required aria-label="Email">
    <input name="subject" placeholder="Subject" aria-label="Subject">
    <textarea name="message" placeholder="Message" aria-label="Message"></textarea>
    <button type="submit">Send</button>
    <p class="status" role="status"></p>
  </form>
</section>
</main>

<footer class="site-footer">&copy; 2023 ASTRA PROJECTIONS, LLC</footer>
<script src="js/site.js"></script>
</body>
</html>
