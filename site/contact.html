<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact | Astra Projections</title>
<meta name="description" content="Contact Astra Projections about talent, gigs and collaborations.">
<link rel="icon" href="img/logo-triangle.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="contact">
<header class="site-header">
  <div class="inner">
    <nav>
      <a href="/">ASTRA PROJECTIONS</a>
      <a href="/services">SERVICES</a>
      <a href="/contact" aria-current="page">CONTACT</a>
    </nav>
    <div class="social">
      <a href="https://www.facebook.com/ASTRAprojections/" target="_blank" rel="noopener" aria-label="Facebook"><img src="img/icon-facebook.png" alt="Facebook"></a>
      <a href="https://www.linkedin.com/company/astra-projections-llc" target="_blank" rel="noopener" aria-label="LinkedIn"><img src="img/icon-linkedin.png" alt="LinkedIn"></a>
    </div>
  </div>
</header>

<main>
<section class="contact-hero">
  <div class="brand">
    <img class="tri" src="img/logo-triangle.png" alt="">
    <img class="word" src="img/logo-wordmark.png" alt="Astra Projections">
  </div>
  <h1>We're always looking for new talent, gigs and <br>collaborations to get involved with. <br>Tell us how you see Astra Projections working for you.</h1>
  <p class="sub">Send us a message using the form below!</p>
  <form id="form" class="quote center" action="/api/contact" method="post">
    <input type="hidden" name="kind" value="contact">
    <div class="hp" aria-hidden="true"><label>Leave this empty <input name="website" tabindex="-1" autocomplete="off"></label></div>
    <input name="name" placeholder="Name *" required aria-label="Name" maxlength="100" autocomplete="name">
    <input name="email" type="email" placeholder="Email *" required aria-label="Email" maxlength="254" autocomplete="email">
    <input name="subject" placeholder="Subject" aria-label="Subject" maxlength="150">
    <textarea name="message" placeholder="Message *" required aria-label="Message" maxlength="5000"></textarea>
    <button type="submit">Send</button>
    <p class="status" role="status"></p>
  </form>
</section>
</main>

<footer class="site-footer">&copy; 2014&ndash;2026 ASTRA PROJECTIONS, LLC</footer>
<script src="js/site.js"></script>
</body>
</html>
